<?xml version="1.0" encoding="UTF-8"?>
<!--
  ShiftWell Tagline Lockup — Dark mode
  Line 1:  Work. Life. Sleep. Rebalanced.   (sentinel serif, "Rebalanced" italic)
  Divider: Fulcrum scale — thin rule + center pivot dot + two balance weights
  Line 2:  ShiftWell                         (sans wordmark, gold accent)

  Canonical palette:
    Background:       #080B14 (token: --bg-primary)
    Text primary:     #FFFFFF
    Accent gold:      #C8A84B (token: --gold)
    Accent purple:    #7B61FF (token: --purple)

  Fonts used (must be loaded by consumer):
    Headline: "Inter" 700 / italic 600  (fallback: system serif → Georgia)
    Body:     "Inter" 600               (fallback: sans-serif)

  Sizing: viewBox is 720×200 for ~3.6:1 aspect. Scales cleanly 64px → 1024px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Work. Life. Sleep. Rebalanced by ShiftWell.">
  <title>ShiftWell tagline lockup — dark</title>

  <!-- Background (transparent by default; uncomment for standalone preview)
  <rect width="720" height="200" fill="#080B14"/>
  -->

  <!-- Line 1: Headline -->
  <g font-family="Inter, Georgia, 'Times New Roman', serif" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="360" y="60" font-size="34" letter-spacing="0.5">
      Work. Life. Sleep. <tspan font-style="italic" font-weight="600" fill="#C8A84B">Rebalanced.</tspan>
    </text>
  </g>

  <!-- Fulcrum divider -->
  <!--
    Composition:
      - Thin horizontal rule 560px wide, centered
      - Two small weight dots at ends (balance-scale terminals)
      - Center triangular pivot, gold accent
  -->
  <g stroke="#C8A84B" stroke-width="1.25" fill="#C8A84B">
    <!-- Horizontal beam -->
    <line x1="120" y1="100" x2="600" y2="100" stroke-linecap="round"/>
    <!-- Left weight -->
    <circle cx="120" cy="100" r="3.5"/>
    <!-- Right weight -->
    <circle cx="600" cy="100" r="3.5"/>
    <!-- Center pivot triangle (fulcrum) -->
    <path d="M 354 100 L 360 110 L 366 100 Z" fill="#C8A84B" stroke="none"/>
    <!-- Small pivot dot atop -->
    <circle cx="360" cy="99.5" r="1.5" fill="#080B14" stroke="#C8A84B" stroke-width="1"/>
  </g>

  <!-- Line 2: Wordmark -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <text x="360" y="155" font-size="28" letter-spacing="2.4">
      ShiftWell
    </text>
  </g>
</svg>
