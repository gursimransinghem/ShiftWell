<?xml version="1.0" encoding="UTF-8"?>
<!--
  ShiftWell — Lane 3 Astronomical
  favicon-32.svg — 32×32

  At 32px the full S-star-field doesn't survive. Strategy:
    1. Keep the crescent moon — it IS the identity at small sizes.
       Positioned left-of-center, opening rightward.
    2. A single gold star (3px diameter) placed at the exact top terminal
       of the S — this is the anchor that hints at the constellation above
       and gives the S its implied top curve.
    3. The crescent's concave edge still traces the S inflection.
    4. One tiny ambient star at lower right at 40% opacity — breathing room.

  At 32×32 the viewer reads: crescent + bright star. The S is implied,
  not rendered — which is correct at this scale. Monochrome version
  (for dark mode system chrome) flattens to white crescent + white dot.

  Sizing:
    Moon: cx=11, cy=16, r=9 (shadow cx=15, cy=13.5, r=9.8)
    Star A (S top): cx=19, cy=7, r=1.6
    Star ambient: cx=26, cy=23, r=0.8
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="ShiftWell favicon">
  <title>ShiftWell</title>
  <defs>
    <radialGradient id="moonFavGrad" cx="36%" cy="40%" r="58%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="60%"  stop-color="#E8E4D8"/>
      <stop offset="100%" stop-color="#C0B89A" stop-opacity="0.88"/>
    </radialGradient>
    <mask id="crescentFavMask">
      <rect width="32" height="32" fill="white"/>
      <circle cx="15" cy="13.5" r="9.8" fill="black"/>
    </mask>
    <filter id="favStarGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="#080B14" rx="6"/>

  <!-- Moon -->
  <circle cx="11" cy="16" r="9"
          fill="url(#moonFavGrad)"
          mask="url(#crescentFavMask)"/>

  <!-- Primary star — S upper terminal anchor -->
  <circle cx="20" cy="7" r="1.7" fill="#C8A84B" filter="url(#favStarGlow)"/>

  <!-- Secondary star — S lower terminal hint -->
  <circle cx="18" cy="26" r="1.3" fill="#C8A84B" filter="url(#favStarGlow)"/>

  <!-- Ambient field star -->
  <circle cx="26" cy="14" r="0.8" fill="#C8A84B" opacity="0.45"/>
</svg>
