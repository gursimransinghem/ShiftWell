<?xml version="1.0" encoding="UTF-8"?>
<!--
  ShiftWell — Lane 3 Astronomical
  icon-1024-light.svg — 1024×1024 on #FFFFFF

  Light background challenge: moon and stars must hold contrast against white.
  Solution — "ink on astronomy paper" approach:
    - Moon: render as a dark ink wash crescent (#1A1F35 fill) with a pale warm
      inner gradient to give it dimensionality — like a lithographic moon print.
      The lit face is left WHITE (paper), the shadow hemisphere is the filled ink shape.
    - Stars: #C8A84B gold reads fine on white (contrast 2.8:1, acceptable at this size)
      but we add a very thin dark halo stroke (#1A1F35, 0.5px, 30% opacity) to
      help the smallest stars read at all sizes.
    - S-curve trace: #7B61FF at 18% opacity — barely visible, still functional.
    - Background texture: a barely-there paper grain (rect + very slight warm tint)

  The result looks like a 19th-century astronomy journal illustration —
  scientific, serious, printable. Not a yoga logo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img"
     aria-label="ShiftWell icon 1024px light">
  <title>ShiftWell — Lane 3 Astronomical — 1024 light</title>
  <defs>
    <!-- "Ink on paper" moon: shadow hemisphere is filled dark ink -->
    <!-- We flip the approach: the shadow circle IS the crescent shape here -->
    <!-- Full circle mask: reveal only the crescent as dark ink -->
    <mask id="crescentInkMask">
      <!-- Start with nothing -->
      <rect width="1024" height="1024" fill="black"/>
      <!-- Full moon disk -->
      <circle cx="491" cy="502" r="184" fill="white"/>
      <!-- Subtract the lit hemisphere (leave shadow as ink) -->
      <circle cx="579.2" cy="466.3" r="194.6" fill="black"/>
    </mask>

    <!-- Lit face gradient (the white/warm paper showing through) -->
    <radialGradient id="litFaceGrad" cx="35%" cy="38%" r="60%">
      <stop offset="0%"   stop-color="#FAFAF8" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#F0EDE6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E8E4D8" stop-opacity="0.30"/>
    </radialGradient>

    <!-- Ink shadow gradient for the dark crescent fill -->
    <radialGradient id="inkGrad" cx="60%" cy="45%" r="65%">
      <stop offset="0%"   stop-color="#1A1F35" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0D1020" stop-opacity="0.88"/>
    </radialGradient>

    <filter id="starGlowLt" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlowPrimaryLt" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: warm off-white, like fine paper -->
  <rect width="1024" height="1024" fill="#FAFAF8"/>
  <!-- Very slight inner shadow to frame the square -->
  <rect width="1024" height="1024" fill="none"
        stroke="#1A1F35" stroke-width="1" stroke-opacity="0.06"/>

  <!-- Faint S-spine -->
  <path d="M 502 307 C 656 307, 717 410, 553 512 C 389 615, 451 717, 605 717"
        fill="none" stroke="#7B61FF" stroke-width="2.5"
        stroke-opacity="0.15" stroke-dasharray="10 16"/>

  <!-- Moon: lit circle outline (subtle arc, paper-white area) -->
  <circle cx="491" cy="502" r="184"
          fill="none"
          stroke="#1A1F35"
          stroke-width="1.5"
          stroke-opacity="0.18"/>

  <!-- Moon shadow: dark ink crescent via mask -->
  <circle cx="491" cy="502" r="184"
          fill="url(#inkGrad)"
          mask="url(#crescentInkMask)"/>

  <!-- Terminator edge refinement: thin dark line where shadow meets lit face -->
  <!-- This is the exposed inner edge of the crescent — the S-inflection line -->
  <circle cx="579.2" cy="466.3" r="194.6"
          fill="none"
          stroke="#1A1F35"
          stroke-width="1.2"
          stroke-opacity="0.22"
          clip-path="none"/>

  <!-- ─── Stars: gold with dark halo for light-background legibility ─── -->
  <!-- Primary S-curve stars -->
  <!-- Star A -->
  <circle cx="584" cy="297" r="11.3" fill="none" stroke="#1A1F35" stroke-width="0.6" stroke-opacity="0.28"/>
  <circle cx="584" cy="297" r="11.3" fill="#C8A84B" filter="url(#starGlowPrimaryLt)"/>
  <!-- Star B -->
  <circle cx="671" cy="353" r="8.2"  fill="none" stroke="#1A1F35" stroke-width="0.5" stroke-opacity="0.22"/>
  <circle cx="671" cy="353" r="8.2"  fill="#C8A84B" filter="url(#starGlowLt)"/>
  <!-- Star C -->
  <circle cx="707" cy="435" r="6.7"  fill="none" stroke="#1A1F35" stroke-width="0.5" stroke-opacity="0.20"/>
  <circle cx="707" cy="435" r="6.7"  fill="#C8A84B" filter="url(#starGlowLt)"/>
  <!-- Star D -->
  <circle cx="650" cy="502" r="5.1"  fill="#C8A84B" filter="url(#starGlowLt)"/>
  <!-- Star E -->
  <circle cx="573" cy="579" r="6.1"  fill="#C8A84B" filter="url(#starGlowLt)"/>
  <!-- Star F -->
  <circle cx="492" cy="650" r="7.7"  fill="none" stroke="#1A1F35" stroke-width="0.5" stroke-opacity="0.20"/>
  <circle cx="492" cy="650" r="7.7"  fill="#C8A84B" filter="url(#starGlowLt)"/>
  <!-- Star G -->
  <circle cx="553" cy="727" r="10.2" fill="none" stroke="#1A1F35" stroke-width="0.6" stroke-opacity="0.26"/>
  <circle cx="553" cy="727" r="10.2" fill="#C8A84B" filter="url(#starGlowPrimaryLt)"/>

  <!-- Ambient field stars (reduced opacity for light bg) -->
  <circle cx="266" cy="317" r="4.6" fill="#C8A84B" opacity="0.60" filter="url(#starGlowLt)"/>
  <circle cx="794" cy="266" r="3.6" fill="#C8A84B" opacity="0.48" filter="url(#starGlowLt)"/>
  <circle cx="758" cy="758" r="4.1" fill="#C8A84B" opacity="0.50" filter="url(#starGlowLt)"/>
  <circle cx="225" cy="707" r="3.1" fill="#C8A84B" opacity="0.40" filter="url(#starGlowLt)"/>
  <circle cx="328" cy="794" r="3.6" fill="#C8A84B" opacity="0.44" filter="url(#starGlowLt)"/>
</svg>
