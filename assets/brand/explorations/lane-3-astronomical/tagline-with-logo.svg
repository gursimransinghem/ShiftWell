<?xml version="1.0" encoding="UTF-8"?>
<!--
  ShiftWell — Lane 3 Astronomical
  tagline-with-logo.svg — Full tagline + astronomical logo lockup

  Layout (760×240 viewBox):
    Row 1 (top):    "Work. Life. Sleep. Rebalanced." — Inter 700, 28px
                    "Rebalanced." in gold italic (matching existing lockup)
    Row 2 (center): Astronomical icon (64×64) + "ShiftWell" wordmark side by side
                    Centered together as a unit
    Row 3 (bottom): Thin gold rule (same as existing tagline-lockup-dark style)
                    No tagline below — the icon IS the statement

  The layout deliberately mirrors the structure of the existing tagline-lockup-dark.svg
  (headline → divider → wordmark) but replaces the Fulcrum divider with the
  astronomical mark, giving the lane-3 concept a fair comparison surface.

  Fonts: Inter 700 / 600 (must be loaded by consumer)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img"
     aria-label="ShiftWell — Work. Life. Sleep. Rebalanced. tagline with astronomical logo">
  <title>ShiftWell — tagline with Lane 3 astronomical logo</title>
  <defs>
    <radialGradient id="moonTagGrad" cx="38%" cy="42%" r="58%" fx="35%" fy="38%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="55%"  stop-color="#E8E4D8"/>
      <stop offset="100%" stop-color="#B8B09A" stop-opacity="0.85"/>
    </radialGradient>
    <mask id="crescentTagMask">
      <rect width="760" height="240" fill="white"/>
      <!-- Shadow circle scaled to icon zone (icon: 32px radius moon, center at ~346,120) -->
      <!-- Shadow offset: +8.5x, +7.5y, radius +2 from moon -->
      <circle cx="354.5" cy="112.5" r="34" fill="black"/>
    </mask>
    <filter id="starGlowTag" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (transparent — consumer sets bg) -->
  <!-- Uncomment for preview: -->
  <rect width="760" height="240" fill="#080B14"/>

  <!-- ─── Row 1: Headline tagline ─── -->
  <g font-family="Inter, Georgia, 'Times New Roman', serif"
     font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="380" y="52" font-size="28" letter-spacing="0.4">
      Work. Life. Sleep.
      <tspan font-style="italic" font-weight="600" fill="#C8A84B"> Rebalanced.</tspan>
    </text>
  </g>

  <!-- ─── Thin rule above icon ─── -->
  <line x1="180" y1="72" x2="580" y2="72"
        stroke="#C8A84B" stroke-width="0.8" stroke-opacity="0.40"/>

  <!-- ─── Row 2: Astronomical icon + wordmark centered ─── -->
  <!--
    Icon mark: 64px diameter circle zone centered at ~(346, 120)
    Moon: cx=346, cy=120, r=28 → shadow: cx=354.5, cy=112.5, r=30
    Stars scaled accordingly.
    Wordmark "ShiftWell" to the right, separated by 14px gap + 1px rule
  -->

  <!-- Moon -->
  <circle cx="346" cy="120" r="28"
          fill="url(#moonTagGrad)"
          mask="url(#crescentTagMask)"/>
  <circle cx="346" cy="120" r="28"
          fill="none" stroke="#FFFFFF" stroke-width="0.35" stroke-opacity="0.18"
          mask="url(#crescentTagMask)"/>

  <!-- S-curve stars (scaled to icon zone, stars positioned relative to 346,120 center) -->
  <!-- Star A — top of S -->
  <circle cx="360" cy="98"  r="2.2" fill="#C8A84B" filter="url(#starGlowTag)"/>
  <!-- Star B -->
  <circle cx="372" cy="105" r="1.6" fill="#C8A84B" filter="url(#starGlowTag)"/>
  <!-- Star C -->
  <circle cx="377" cy="115" r="1.3" fill="#C8A84B" filter="url(#starGlowTag)"/>
  <!-- Star D — waist -->
  <circle cx="372" cy="121" r="1.0" fill="#C8A84B" filter="url(#starGlowTag)"/>
  <!-- Star E -->
  <circle cx="364" cy="128" r="1.1" fill="#C8A84B" filter="url(#starGlowTag)"/>
  <!-- Star F -->
  <circle cx="350" cy="135" r="1.4" fill="#C8A84B" filter="url(#starGlowTag)"/>
  <!-- Star G — bottom of S -->
  <circle cx="355" cy="144" r="2.0" fill="#C8A84B" filter="url(#starGlowTag)"/>

  <!-- Ambient stars within icon zone -->
  <circle cx="320" cy="100" r="0.8" fill="#C8A84B" opacity="0.42" filter="url(#starGlowTag)"/>
  <circle cx="378" cy="142" r="0.7" fill="#C8A84B" opacity="0.35" filter="url(#starGlowTag)"/>

  <!-- Separator rule between icon and wordmark -->
  <line x1="398" y1="98" x2="398" y2="142"
        stroke="#C8A84B" stroke-width="0.7" stroke-opacity="0.50" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="410" y="128"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-weight="600"
        font-size="26"
        letter-spacing="2.0"
        fill="#FFFFFF">Shift<tspan fill="#C8A84B">Well</tspan></text>

  <!-- ─── Thin rule below icon ─── -->
  <line x1="180" y1="168" x2="580" y2="168"
        stroke="#C8A84B" stroke-width="0.8" stroke-opacity="0.40"/>

  <!-- ─── Row 3: Sub-caption (precision instrument framing) ─── -->
  <text x="380" y="196"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-weight="400"
        font-size="11"
        letter-spacing="3.2"
        fill="#FFFFFF"
        fill-opacity="0.45"
        text-anchor="middle">CIRCADIAN OPTIMIZATION FOR SHIFT WORKERS</text>
</svg>
