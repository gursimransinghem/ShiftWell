<?xml version="1.0" encoding="UTF-8"?>
<!--
  ShiftWell — Lane 3 Astronomical
  icon-1024-dark.svg — 1024×1024 on #080B14, 12% padding

  Padding: 12% = 122.88px each side → logo occupies 778×778px centered
  All geometry scaled from the 200×200 concept master by factor 5.12
  (778 / 152 ≈ 5.12 to fill the 778px safe zone, then offset to center)

  Scaling strategy:
    concept viewBox 200×200, logo lives roughly in a 152×100 bounding box
    centered at (100,100). We scale up and center in 1024×1024 with padding.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img"
     aria-label="ShiftWell icon 1024px dark">
  <title>ShiftWell — Lane 3 Astronomical — 1024 dark</title>
  <defs>
    <radialGradient id="moonGlowL" cx="38%" cy="42%" r="58%" fx="35%" fy="38%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#E8E4D8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#B8B09A" stop-opacity="0.85"/>
    </radialGradient>
    <mask id="crescentMaskL">
      <rect width="1024" height="1024" fill="white"/>
      <circle cx="579.2" cy="466.3" r="194.6" fill="black"/>
    </mask>
    <filter id="starGlowL" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Larger diffraction for primary stars -->
    <filter id="starGlowPrimary" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#080B14"/>

  <!-- Subtle vignette for depth -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#080B14" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
  </radialGradient>

  <!-- Faint S-spine orbit trace -->
  <path d="M 502 307 C 656 307, 717 410, 553 512 C 389 615, 451 717, 605 717"
        fill="none" stroke="#7B61FF" stroke-width="3.5"
        stroke-opacity="0.10" stroke-dasharray="13 18"/>

  <!-- Moon: full disk × 5.12 scale centered -->
  <!-- Original: cx=96, cy=98, r=36 → ×5.12 = cx=491.5, cy=501.8, r=184.3 -->
  <circle cx="491" cy="502" r="184"
          fill="url(#moonGlowL)"
          mask="url(#crescentMaskL)"/>
  <circle cx="491" cy="502" r="184"
          fill="none" stroke="#FFFFFF" stroke-width="2"
          stroke-opacity="0.20"
          mask="url(#crescentMaskL)"/>

  <!-- ─── Primary S-curve stars (scaled ×5.12) ─── -->
  <!-- Star A: cx=114→583.7, cy=58→297.0 -->
  <circle cx="584" cy="297" r="11.3" fill="#C8A84B" filter="url(#starGlowPrimary)"/>
  <!-- Star B: cx=131→670.7, cy=69→353.3 -->
  <circle cx="671" cy="353" r="8.2" fill="#C8A84B" filter="url(#starGlowL)"/>
  <!-- Star C: cx=138→706.6, cy=85→435.2 -->
  <circle cx="707" cy="435" r="6.7" fill="#C8A84B" filter="url(#starGlowL)"/>
  <!-- Star D: cx=127→650.2, cy=98→501.8 -->
  <circle cx="650" cy="502" r="5.1" fill="#C8A84B" filter="url(#starGlowL)"/>
  <!-- Star E: cx=112→573.4, cy=113→578.6 -->
  <circle cx="573" cy="579" r="6.1" fill="#C8A84B" filter="url(#starGlowL)"/>
  <!-- Star F: cx=96→491.5, cy=127→650.2 -->
  <circle cx="492" cy="650" r="7.7" fill="#C8A84B" filter="url(#starGlowL)"/>
  <!-- Star G: cx=108→553, cy=142→727.0 -->
  <circle cx="553" cy="727" r="10.2" fill="#C8A84B" filter="url(#starGlowPrimary)"/>

  <!-- ─── Ambient field stars ─── -->
  <circle cx="266"  cy="317"  r="4.6" fill="#C8A84B" opacity="0.55" filter="url(#starGlowL)"/>
  <circle cx="794"  cy="266"  r="3.6" fill="#C8A84B" opacity="0.40" filter="url(#starGlowL)"/>
  <circle cx="758"  cy="758"  r="4.1" fill="#C8A84B" opacity="0.42" filter="url(#starGlowL)"/>
  <circle cx="225"  cy="707"  r="3.1" fill="#C8A84B" opacity="0.32" filter="url(#starGlowL)"/>
  <circle cx="328"  cy="794"  r="3.6" fill="#C8A84B" opacity="0.36" filter="url(#starGlowL)"/>
  <!-- Extra depth stars for large format -->
  <circle cx="174"  cy="491"  r="2.6" fill="#C8A84B" opacity="0.28" filter="url(#starGlowL)"/>
  <circle cx="850"  cy="594"  r="2.1" fill="#C8A84B" opacity="0.25" filter="url(#starGlowL)"/>
  <circle cx="440"  cy="184"  r="2.1" fill="#C8A84B" opacity="0.30" filter="url(#starGlowL)"/>

  <!-- Vignette overlay -->
  <rect width="1024" height="1024" fill="url(#vignette)"/>
</svg>
