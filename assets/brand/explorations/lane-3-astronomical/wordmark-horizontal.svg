<?xml version="1.0" encoding="UTF-8"?>
<!--
  ShiftWell — Lane 3 Astronomical
  wordmark-horizontal.svg — Logo + "ShiftWell" horizontal lockup

  Layout:
    - Icon: 52×52px (scaled concept mark) — left
    - 16px gap
    - "ShiftWell": Inter 600, 32px, letter-spacing 0.08em — right
      "Shift" in white, "Well" in gold (#C8A84B) — the split echoes
      shift-then-restoration, and the gold matches the stars.

  Total viewBox: 320×72 (comfortable breathing room)
  Icon centered vertically at y=10 (52px tall icon, in 72px height → 10px padding)
  Text baseline at y=44 (optical center in 72px)

  Font: Inter 600 (same as existing lockup). Letter-spacing 0.08em = wide/tracked.
  The font must be loaded by the consumer — fallback: -apple-system, sans-serif.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img"
     aria-label="ShiftWell wordmark — astronomical logo with wordmark">
  <title>ShiftWell — horizontal wordmark lockup</title>
  <defs>
    <radialGradient id="moonHorizGrad" cx="38%" cy="42%" r="58%" fx="35%" fy="38%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#E8E4D8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#B8B09A" stop-opacity="0.85"/>
    </radialGradient>
    <mask id="crescentHorizMask">
      <rect width="320" height="72" fill="white"/>
      <!-- Shadow circle: scaled so moon cx=26,cy=36,r=18 → shadow cx=31.5,cy=32.5,r=19.5 -->
      <circle cx="31.5" cy="32.5" r="19.5" fill="black"/>
    </mask>
    <filter id="starGlowHz" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.55" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (transparent by default — consumer sets bg) -->
  <!-- Uncomment for standalone preview: -->
  <rect width="320" height="72" fill="#080B14"/>

  <!-- ─── Icon mark (52×52, padded 10px top/bottom) ─── -->
  <!-- Moon: radius 18, center at (26, 36) in the 52×52 zone -->
  <circle cx="26" cy="36" r="18"
          fill="url(#moonHorizGrad)"
          mask="url(#crescentHorizMask)"/>
  <circle cx="26" cy="36" r="18"
          fill="none" stroke="#FFFFFF" stroke-width="0.3" stroke-opacity="0.2"
          mask="url(#crescentHorizMask)"/>

  <!-- S-curve stars (icon zone: 0–52px x, 0–72px y) -->
  <!-- Star A — S top terminal -->
  <circle cx="33" cy="15" r="1.8" fill="#C8A84B" filter="url(#starGlowHz)"/>
  <!-- Star B -->
  <circle cx="42" cy="21" r="1.3" fill="#C8A84B" filter="url(#starGlowHz)"/>
  <!-- Star C -->
  <circle cx="45" cy="30" r="1.1" fill="#C8A84B" filter="url(#starGlowHz)"/>
  <!-- Star D — waist -->
  <circle cx="40" cy="37" r="0.9" fill="#C8A84B" filter="url(#starGlowHz)"/>
  <!-- Star E -->
  <circle cx="34" cy="44" r="1.0" fill="#C8A84B" filter="url(#starGlowHz)"/>
  <!-- Star F -->
  <circle cx="26" cy="52" r="1.2" fill="#C8A84B" filter="url(#starGlowHz)"/>
  <!-- Star G — S bottom terminal -->
  <circle cx="31" cy="60" r="1.6" fill="#C8A84B" filter="url(#starGlowHz)"/>

  <!-- Ambient field stars (within icon zone) -->
  <circle cx="8"  cy="18" r="0.7" fill="#C8A84B" opacity="0.45" filter="url(#starGlowHz)"/>
  <circle cx="48" cy="56" r="0.6" fill="#C8A84B" opacity="0.35" filter="url(#starGlowHz)"/>

  <!-- ─── Vertical separator rule (thin, gold, 60% opacity) ─── -->
  <line x1="64" y1="16" x2="64" y2="56"
        stroke="#C8A84B" stroke-width="0.8" stroke-opacity="0.55" stroke-linecap="round"/>

  <!-- ─── Wordmark: "Shift" white + "Well" gold ─── -->
  <!-- font-family must be loaded by consumer: Inter 600 -->
  <text x="76" y="44"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-weight="600"
        font-size="29"
        letter-spacing="2.2"
        fill="#FFFFFF">Shift<tspan fill="#C8A84B">Well</tspan></text>

</svg>
