<?xml version="1.0" encoding="UTF-8"?>
<!--
  ShiftWell — Lane 1 Fulcrum / Scale Minimalism
  Master concept — scalable, no embedded raster, palette-locked.

  Design language:
    A single horizontal beam with three terminal nodes (Work · Life · Sleep)
    balanced on a downward equilateral triangle pivot (the "aha" moment).
    The beam reads as a precision instrument, not a courtroom scale.
    The pivot triangle is the only element in gold — one accent, nothing else.

  Palette (strict):
    --bg-dark:   #080B14
    --text-white: #FFFFFF
    --gold:      #C8A84B
    --purple:    #7B61FF
    --ink:       #1F2133

  viewBox: 120×72  (5:3 ratio, optimal for icon crop and wide lockup)
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 72"
  role="img"
  aria-label="ShiftWell logo — fulcrum balance mark"
>
  <title>ShiftWell</title>
  <desc>A horizontal beam with three nodes balanced on a downward-pointing triangle pivot — representing Work, Life, and Sleep in equilibrium.</desc>

  <!-- ═══════════════════════════════════════════
       MARK — beam + nodes + pivot
       All coordinates relative to center (60, 36)
  ═══════════════════════════════════════════ -->

  <g id="mark">

    <!-- Horizontal beam
         Stroke only. Round caps for instrument precision.
         Full width: 80px (x: 20 → 100), y: 34
    -->
    <line
      x1="20" y1="34"
      x2="100" y2="34"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linecap="round"
    />

    <!-- Left terminal node — Work
         Filled circle, white, at beam left end
    -->
    <circle cx="20" cy="34" r="4" fill="#FFFFFF"/>

    <!-- Center node — Life
         Slightly larger — the living core.
         White fill, gold ring to signal the central axis.
    -->
    <circle cx="60" cy="34" r="4" fill="#FFFFFF"/>
    <circle cx="60" cy="34" r="6.5" fill="none" stroke="#C8A84B" stroke-width="1.5"/>

    <!-- Right terminal node — Sleep
         Filled circle, white, at beam right end
    -->
    <circle cx="100" cy="34" r="4" fill="#FFFFFF"/>

    <!-- Pivot — downward equilateral triangle
         Base sits flush under the beam (y=34), apex points down.
         Gold — the only color accent in the entire mark.
         Triangle height: 14px → apex at y=48
         Base width: 14px → x: 53 → 67
    -->
    <polygon
      points="53,34 67,34 60,48"
      fill="#C8A84B"
    />

    <!-- Pivot base line — thin separator between beam and triangle
         Keeps the beam visually floating above the fulcrum.
    -->
    <line
      x1="53" y1="34"
      x2="67" y2="34"
      stroke="#080B14"
      stroke-width="1.25"
    />

  </g>

</svg>
