<?xml version="1.0" encoding="UTF-8"?>
<!--
  ShiftWell — App Icon 1024×1024 — Dark background
  iOS App Store candidate. 12% margin applied (≈123px each side).
  Mark sits in 778px safe zone centered on a #080B14 square.

  The mark scales proportionally from the 120×72 concept viewBox.
  At 1024px the beam is substantial; the gold triangle reads unmistakably.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  role="img"
  aria-label="ShiftWell app icon — dark"
>
  <title>ShiftWell</title>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#080B14"/>

  <!--
    Mark placement:
      Safe zone: 123px margin → mark area 778×778
      Mark intrinsic ratio: 120:72 = 5:3
      At width=680: height = 680×(72/120) = 408
      Horizontal center: 512
      Vertical center: 512 (shift up slightly for visual weight: 490)

      Mark coords translated:
        Concept viewBox 120×72, scale to 680×408
        Scale factor: 680/120 = 5.6667
        Origin offset: x = 512 - 340 = 172, y = 490 - 204 = 286

      Beam y in concept: 34 → 34×5.6667 = 192.67 + 286 = 478.67 ≈ 479
      Left node cx: 20×5.667+172 = 113.33+172 = 285
      Right node cx: 100×5.667+172 = 566.67+172 = 739
      Center cx: 60×5.667+172 = 340+172 = 512
      Node r: 4×5.667 = 22.67 ≈ 23
      Gold ring r: 6.5×5.667 = 36.8 ≈ 37
      Gold ring stroke: 1.5×5.667 = 8.5
      Beam stroke: 2×5.667 = 11.33 ≈ 11.5
      Triangle:
        left:  53×5.667+172 = 300.35+172 = 472
        right: 67×5.667+172 = 379.67+172 = 552
        apex y: 48×5.667+286 = 272+286 = 558
      Pivot separator stroke: 1.25×5.667 = 7.08 ≈ 7
  -->

  <g id="mark">

    <!-- Beam -->
    <line
      x1="285" y1="479"
      x2="739" y2="479"
      stroke="#FFFFFF"
      stroke-width="11.5"
      stroke-linecap="round"
    />

    <!-- Left node — Work -->
    <circle cx="285" cy="479" r="23" fill="#FFFFFF"/>

    <!-- Center node — Life (gold ring accent) -->
    <circle cx="512" cy="479" r="23" fill="#FFFFFF"/>
    <circle cx="512" cy="479" r="37" fill="none" stroke="#C8A84B" stroke-width="8.5"/>

    <!-- Right node — Sleep -->
    <circle cx="739" cy="479" r="23" fill="#FFFFFF"/>

    <!-- Pivot triangle -->
    <polygon
      points="472,479 552,479 512,558"
      fill="#C8A84B"
    />

    <!-- Pivot separator -->
    <line
      x1="472" y1="479"
      x2="552" y2="479"
      stroke="#080B14"
      stroke-width="7"
    />

  </g>

</svg>
