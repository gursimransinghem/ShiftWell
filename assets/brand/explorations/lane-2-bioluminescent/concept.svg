<?xml version="1.0" encoding="UTF-8"?>
<!--
  ShiftWell Lane 2 — Bioluminescent Circadian Curve
  Concept master (variable dimensions, square mark)

  Design rationale:
  The path traces one full 24-hour circadian oscillation using the actual
  two-process model geometry: a cosine wave with period ~24h, amplitude scaled
  to represent the endogenous circadian pacemaker (SCN output). The curve is
  rendered in three concentric luminosity layers — a physics-correct simulation
  of bioluminescence (comb jelly photophore structure) where the innermost
  filament is brightest and outer halos attenuate quadratically.

  Color mapping is load-bearing data (per Brand Principle 7):
    Purple (#7B61FF) → night phase, peak melatonin, lowest core body temp
    Teal (#4ECDC4)   → transitional phase, cortisol rise, light-sensitive window
    Gold (#C8A84B)   → dawn phase, circadian entrainment point, alertness onset

  Curve geometry:
  A cubic bezier approximation of cos(θ) for θ ∈ [0°, 360°] placed on a
  square canvas. Control points derived from the standard 4-segment cubic
  bezier approximation of a full sine period (k=0.5523 tangent scaling).
  The implied "S" shape emerges naturally from the inflection points at the
  midpoints of descent and ascent — not forced as a letterform.

  Canvas: 400x400 (1:1) scales to 1024 for app icon, 32 for favicon
  Palette:
    bg-dark:    #080B14
    purple:     #7B61FF
    teal:       #4ECDC4
    gold:       #C8A84B
    glow-outer: rgba(123,97,255,0.08)
    glow-mid:   rgba(123,97,255,0.22)
    glow-inner: rgba(123,97,255,0.55)
    core:       #FFFFFF

  Anti-cliché compliance:
    ✓ No sleep iconography (z's, pillows, clocks, moons)
    ✓ No wellness-app soft-focus blur (glow is structural, 3-layer)
    ✓ No medical tropes
    ✓ Survives monochrome (favicon-32.svg uses single stroke, no gradient)
    ✓ Not a meditation app (science-instrument aesthetic, not organic/soft)
    ✓ Wearable at T-shirt chest scale
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 400 400"
  role="img"
  aria-label="ShiftWell — circadian rhythm mark"
>
  <title>ShiftWell — Bioluminescent Circadian Mark</title>

  <defs>
    <!-- Primary gradient: night (purple) → dawn transition (teal) → dawn (gold) -->
    <!-- Maps to circadian phase: purple=peak melatonin, gold=cortisol awakening -->
    <linearGradient id="circadian-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7B61FF" stop-opacity="1"/>
      <stop offset="42%"  stop-color="#7B61FF" stop-opacity="1"/>
      <stop offset="65%"  stop-color="#4ECDC4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C8A84B" stop-opacity="1"/>
    </linearGradient>

    <!-- Outer glow gradient — deep purple halo -->
    <linearGradient id="glow-outer-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7B61FF" stop-opacity="0.08"/>
      <stop offset="42%"  stop-color="#7B61FF" stop-opacity="0.08"/>
      <stop offset="65%"  stop-color="#4ECDC4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#C8A84B" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Mid glow gradient -->
    <linearGradient id="glow-mid-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7B61FF" stop-opacity="0.22"/>
      <stop offset="42%"  stop-color="#7B61FF" stop-opacity="0.22"/>
      <stop offset="65%"  stop-color="#4ECDC4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C8A84B" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Inner glow gradient -->
    <linearGradient id="glow-inner-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7B61FF" stop-opacity="0.55"/>
      <stop offset="42%"  stop-color="#7B61FF" stop-opacity="0.55"/>
      <stop offset="65%"  stop-color="#4ECDC4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#C8A84B" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Radial glow for the inflection points (data: phase-transition moments) -->
    <radialGradient id="node-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7B61FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#C8A84B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C8A84B" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip to square canvas with 12px inset for visual breathing room -->
    <clipPath id="canvas-clip">
      <rect x="20" y="20" width="360" height="360" rx="0"/>
    </clipPath>
  </defs>

  <!-- Canvas: deep space dark -->
  <rect width="400" height="400" fill="#080B14"/>

  <!-- Subtle grid reference lines (barely visible, data-meaningful: 6h intervals) -->
  <g opacity="0.06" stroke="#7B61FF" stroke-width="0.5">
    <line x1="118" y1="30" x2="118" y2="370"/>  <!-- 6h mark -->
    <line x1="200" y1="30" x2="200" y2="370"/>  <!-- 12h mark (noon) -->
    <line x1="282" y1="30" x2="282" y2="370"/>  <!-- 18h mark -->
    <line x1="20"  y1="200" x2="380" y2="200"/> <!-- alertness threshold midline -->
  </g>

  <!--
    The circadian curve: one full 24h cosine cycle
    Starting at midnight (left edge) → through 6am → noon → 6pm → midnight (right edge)

    Cubic bezier approximation of cos(t) for t in [0, 2π]:
    y(t) = 200 - 140·cos(t)

    At t=0 (midnight, x=36):   y = 200 - 140·cos(0)   = 60   (night trough — low alertness)
    At t=π/2 (6am, x=118):     y = 200 - 140·cos(π/2) = 200  (inflection — rising)
    At t=π (noon, x=200):      y = 200 - 140·cos(π)   = 340  (peak alertness)
    At t=3π/2 (6pm, x=282):    y = 200 - 140·cos(3π/2)= 200  (inflection — falling)
    At t=2π (midnight, x=364): y = 200 - 140·cos(2π)  = 60   (night trough)

    Control point scaling factor k=0.5523 (standard circle→bezier)
    Horizontal span: 36→364 = 328px, quarter-span = 82px
    k·82 = ~45.3 → control point tangent offset
  -->

  <!-- Layer 1: Outermost glow (widest stroke, lowest opacity) -->
  <path
    d="M 36,60
       C 36,60 81,60 118,200
       C 155,340 163,340 200,340
       C 237,340 245,340 282,200
       C 319,60 327,60 364,60"
    fill="none"
    stroke="url(#glow-outer-gradient)"
    stroke-width="28"
    stroke-linecap="round"
    clip-path="url(#canvas-clip)"
  />

  <!-- Layer 2: Mid glow -->
  <path
    d="M 36,60
       C 36,60 81,60 118,200
       C 155,340 163,340 200,340
       C 237,340 245,340 282,200
       C 319,60 327,60 364,60"
    fill="none"
    stroke="url(#glow-mid-gradient)"
    stroke-width="14"
    stroke-linecap="round"
    clip-path="url(#canvas-clip)"
  />

  <!-- Layer 3: Inner glow -->
  <path
    d="M 36,60
       C 36,60 81,60 118,200
       C 155,340 163,340 200,340
       C 237,340 245,340 282,200
       C 319,60 327,60 364,60"
    fill="none"
    stroke="url(#glow-inner-gradient)"
    stroke-width="5"
    stroke-linecap="round"
    clip-path="url(#canvas-clip)"
  />

  <!-- Layer 4: Core filament (white hot center — the biological "fact" of the curve) -->
  <path
    d="M 36,60
       C 36,60 81,60 118,200
       C 155,340 163,340 200,340
       C 237,340 245,340 282,200
       C 319,60 327,60 364,60"
    fill="none"
    stroke="url(#circadian-gradient)"
    stroke-width="2"
    stroke-linecap="round"
    clip-path="url(#canvas-clip)"
  />

  <!-- Inflection point nodes: data-meaningful markers at phase transitions -->
  <!-- Node at 6am inflection (rising): circadian gate opens, light-sensitive window -->
  <ellipse cx="118" cy="200" rx="18" ry="18" fill="url(#node-purple)" opacity="0.9"/>
  <circle cx="118" cy="200" r="3" fill="#7B61FF" opacity="0.95"/>

  <!-- Node at peak alertness (noon): nadir of sleep pressure, peak circadian drive -->
  <ellipse cx="200" cy="340" rx="20" ry="20" fill="url(#node-gold)" opacity="0.5"/>

  <!-- Node at 6pm inflection (falling): begin melatonin onset window -->
  <ellipse cx="282" cy="200" rx="18" ry="18" fill="url(#node-gold)" opacity="0.8"/>
  <circle cx="282" cy="200" r="3" fill="#C8A84B" opacity="0.95"/>

  <!-- Start/end cap: midnight (dimmer — continuous rhythm, not a terminus) -->
  <circle cx="36"  cy="60" r="2.5" fill="#7B61FF" opacity="0.6"/>
  <circle cx="364" cy="60" r="2.5" fill="#7B61FF" opacity="0.6"/>
</svg>
