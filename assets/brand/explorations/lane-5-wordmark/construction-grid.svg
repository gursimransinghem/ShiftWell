<?xml version="1.0" encoding="UTF-8"?>
<!--
  ShiftWell — Lane 5 — Construction Grid
  Shows the geometric system that generates the SW ligature.

  This grid proves the mark is systematic, not arbitrary.
  Every curve, node, and joint is derived from the same circle-grid.

  Grid: 8×8 unit cells. viewBox 200×100 matches extended mark canvas.
  The mark (viewBox 160×80) is centered with 20px horizontal margin.

  Construction elements shown:
    1. Base grid — 10px cells, thin rules
    2. Cap-height guide — y=8  (top of letters)
    3. Baseline guide   — y=72 (bottom of letters)
    4. Midline guide    — y=40 (S counter-rotation point)
    5. S construction circles:
         Upper: center (40, 24), r=20 → governs top bowl curve
         Lower: center (40, 56), r=20 → governs bottom bowl curve
    6. W node grid — 5 points, labeled A–E
    7. Center peak analysis — y=26 annotated
    8. Ligature joint line — highlighted in purple
    9. The actual mark rendered at full opacity over the guides
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 100"
  role="img"
  aria-label="SW ligature construction grid"
>
  <title>SW Ligature — Construction Grid</title>

  <!-- ═══════════════════
       BACKGROUND
  ═══════════════════ -->
  <rect width="200" height="100" fill="#080B14"/>

  <!-- ═══════════════════
       BASE GRID — 10px cells
       Barely visible — guides, not design elements
  ═══════════════════ -->
  <g stroke="#1F2840" stroke-width="0.25" opacity="0.8">
    <!-- Vertical grid lines, x=0 to x=200, step 10 -->
    <line x1="10" y1="0" x2="10" y2="100"/>
    <line x1="20" y1="0" x2="20" y2="100"/>
    <line x1="30" y1="0" x2="30" y2="100"/>
    <line x1="40" y1="0" x2="40" y2="100"/>
    <line x1="50" y1="0" x2="50" y2="100"/>
    <line x1="60" y1="0" x2="60" y2="100"/>
    <line x1="70" y1="0" x2="70" y2="100"/>
    <line x1="80" y1="0" x2="80" y2="100"/>
    <line x1="90" y1="0" x2="90" y2="100"/>
    <line x1="100" y1="0" x2="100" y2="100"/>
    <line x1="110" y1="0" x2="110" y2="100"/>
    <line x1="120" y1="0" x2="120" y2="100"/>
    <line x1="130" y1="0" x2="130" y2="100"/>
    <line x1="140" y1="0" x2="140" y2="100"/>
    <line x1="150" y1="0" x2="150" y2="100"/>
    <line x1="160" y1="0" x2="160" y2="100"/>
    <line x1="170" y1="0" x2="170" y2="100"/>
    <line x1="180" y1="0" x2="180" y2="100"/>
    <line x1="190" y1="0" x2="190" y2="100"/>
    <!-- Horizontal grid lines, y=0 to y=100, step 10 -->
    <line x1="0" y1="10" x2="200" y2="10"/>
    <line x1="0" y1="20" x2="200" y2="20"/>
    <line x1="0" y1="30" x2="200" y2="30"/>
    <line x1="0" y1="40" x2="200" y2="40"/>
    <line x1="0" y1="50" x2="200" y2="50"/>
    <line x1="0" y1="60" x2="200" y2="60"/>
    <line x1="0" y1="70" x2="200" y2="70"/>
    <line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="90" x2="200" y2="90"/>
  </g>

  <!-- ═══════════════════
       MARK BOUNDARY BOX
       x=20, y=10, w=160, h=80 — the canonical mark canvas
  ═══════════════════ -->
  <rect
    x="20" y="10" width="160" height="80"
    fill="none"
    stroke="#C8A84B"
    stroke-width="0.5"
    stroke-dasharray="3,2"
    opacity="0.4"
  />

  <!-- ═══════════════════
       TYPOGRAPHIC GUIDES
  ═══════════════════ -->
  <!-- Cap-height: y=18 (mark top y=10, cap-height = 10+8 = 18) -->
  <line x1="0" y1="18" x2="200" y2="18" stroke="#C8A84B" stroke-width="0.4" opacity="0.6" stroke-dasharray="4,3"/>
  <!-- Baseline: y=82 (mark bottom y=90, baseline = 90-8 = 82) -->
  <line x1="0" y1="82" x2="200" y2="82" stroke="#C8A84B" stroke-width="0.4" opacity="0.6" stroke-dasharray="4,3"/>
  <!-- Midline: y=50 — S counter-rotation pivot -->
  <line x1="0" y1="50" x2="200" y2="50" stroke="#7B61FF" stroke-width="0.4" opacity="0.5" stroke-dasharray="2,3"/>

  <!-- ═══════════════════
       S CONSTRUCTION CIRCLES
       Translated to match mark at x=20 offset
  ═══════════════════ -->
  <!-- Upper circle: center (20+40, 10+24) = (60, 34), r=20 -->
  <circle
    cx="60" cy="34" r="20"
    fill="none"
    stroke="#7B61FF"
    stroke-width="0.5"
    stroke-dasharray="3,2"
    opacity="0.4"
  />
  <!-- Lower circle: center (20+40, 10+56) = (60, 66), r=20 -->
  <circle
    cx="60" cy="66" r="20"
    fill="none"
    stroke="#7B61FF"
    stroke-width="0.5"
    stroke-dasharray="3,2"
    opacity="0.4"
  />
  <!-- Circle center markers -->
  <circle cx="60" cy="34" r="1" fill="#7B61FF" opacity="0.6"/>
  <circle cx="60" cy="66" r="1" fill="#7B61FF" opacity="0.6"/>

  <!-- ═══════════════════
       W NODE MARKERS
       Translated: mark starts at x=20, W starts at x=20+64=84
       Nodes in mark coords (adding x=20, y=10 offset):
         A: (84, 18) — shared with joint top
         B: (102, 82) — first valley
         C: (120, 36) — center peak
         D: (138, 82) — second valley
         E: (168, 18) — top-right
  ═══════════════════ -->
  <g fill="#C8A84B" opacity="0.7">
    <circle cx="84" cy="18" r="1.5"/>
    <circle cx="102" cy="82" r="1.5"/>
    <circle cx="120" cy="36" r="1.5"/>
    <circle cx="138" cy="82" r="1.5"/>
    <circle cx="168" cy="18" r="1.5"/>
  </g>

  <!-- Node connector lines (W skeleton) -->
  <polyline
    points="84,18 102,82 120,36 138,82 168,18"
    fill="none"
    stroke="#C8A84B"
    stroke-width="0.4"
    stroke-dasharray="2,2"
    opacity="0.3"
  />

  <!-- ═══════════════════
       LIGATURE JOINT HIGHLIGHT
       x=84 (mark x=20 + joint x=64)
  ═══════════════════ -->
  <line
    x1="84" y1="66"
    x2="84" y2="18"
    stroke="#7B61FF"
    stroke-width="1"
    opacity="0.4"
    stroke-dasharray="2,1"
  />

  <!-- ═══════════════════
       ACTUAL MARK — rendered at 50% opacity over guides
       then at 100% opacity for final layer
       Using transform: translate(20, 10) to shift into canvas area
  ═══════════════════ -->

  <!-- Ghost layer (50% — shows how mark sits on grid) -->
  <g transform="translate(20, 10)" opacity="0.3">
    <path d="M 56,12 C 56,4 44,4 40,4 C 28,4 16,12 16,24 C 16,36 28,40 40,40" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 40,40 C 52,40 64,44 64,56 C 64,68 52,76 40,76 C 28,76 16,68 16,60" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="64" y1="56" x2="64" y2="8" stroke="#7B61FF" stroke-width="8" stroke-linecap="round"/>
    <polyline points="64,8 82,72 100,26 118,72 148,8" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ═══════════════════
       LABELS — minimal, systematic
       Font: monospace 3.5px — proves this is documentation
  ═══════════════════ -->
  <g font-family="'Courier New', Courier, monospace" font-size="3.5" fill="#C8A84B" opacity="0.8">
    <!-- Cap-height label -->
    <text x="2" y="17">cap</text>
    <!-- Baseline label -->
    <text x="2" y="81">base</text>
  </g>
  <g font-family="'Courier New', Courier, monospace" font-size="3.5" fill="#7B61FF" opacity="0.8">
    <!-- Midline label -->
    <text x="2" y="49">mid</text>
    <!-- Joint label -->
    <text x="75" y="90">joint</text>
  </g>
  <g font-family="'Courier New', Courier, monospace" font-size="3.5" fill="#C8A84B" opacity="0.9">
    <!-- W node labels -->
    <text x="81" y="14">A</text>
    <text x="99" y="90">B</text>
    <text x="117" y="32">C</text>
    <text x="135" y="90">D</text>
    <text x="165" y="14">E</text>
  </g>

  <!-- Center peak annotation — the branded asymmetry -->
  <line x1="0" y1="36" x2="200" y2="36" stroke="#FFFFFF" stroke-width="0.25" opacity="0.2" stroke-dasharray="1,4"/>
  <g font-family="'Courier New', Courier, monospace" font-size="3" fill="#FFFFFF" opacity="0.5">
    <text x="172" y="35">C≠cap</text>
  </g>

</svg>
